name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    name: typecheck · lint · test · build (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install extra test shells (Linux)
        # The completion tests execute each emitted template in its real shell
        # and self-skip where that shell is missing. macOS ships zsh and Windows
        # has bash via Git Bash; fish is in no default image, so Linux installs
        # zsh and fish - skipping fish would let a broken template ship green.
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y zsh fish

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify committed lib/ is up to date
        # lib/ is committed and shipped to npm — a stale build means the
        # published package would drift from src/. tsc is deterministic and
        # OS-independent, so a fresh build must produce zero diff. This check
        # runs only on ubuntu to avoid Windows CRLF / core.autocrlf false
        # positives in `git diff`; typecheck/lint/test/build still run on all
        # three OS so the Windows junction / macOS symlink paths are covered.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if ! git diff --exit-code --quiet -- lib/; then
            echo "::error::lib/ is out of date — run 'npm run build' and commit the result"
            git diff --stat -- lib/
            exit 1
          fi
          echo "lib/ is up to date"

  legacy-git:
    # The sparse integration tests need `sparse-checkout set --cone` (Git 2.35+,
    # Jan 2022). This job pins the other half of that contract: on the Git
    # Ubuntu 22.04 LTS still ships — 2.34.1, a supported release into 2027 —
    # the gated tests must skip, the CLI must degrade to a full clone, and
    # everything else must pass. The full suite runs on purpose: anything that
    # silently needs a newer Git fails here instead of on a user's machine.
    name: unit tests on Ubuntu 22.04's legacy Git 2.34
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install Git (absent from the minimal container image)
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates

      - name: Confirm the legacy Git under test
        run: |
          git --version
          git --version | grep -q '2\.34\.' || {
            echo "::error::expected Ubuntu 22.04's Git 2.34.x in this container"
            exit 1
          }

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
