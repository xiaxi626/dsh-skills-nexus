<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="How nexus works">
  <style>
    :root{
      --paper:#f6f2ea; --paper-2:#efe9dd; --card:#fffdf8;
      --line:#e0d8c8; --line-2:#cfc5b0;
      --ink:#2b2620; --ink-2:#5f574a; --ink-3:#8b8172;
      --cinnabar:#c0392b; --cinnabar-deep:#a12f22;
      --cinnabar-soft:#f7e5e2; --cinnabar-border:#e5c4be;
      --sans:"Inter","SF Pro Text","PingFang SC","Noto Sans SC",system-ui,sans-serif;
      --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --paper:#211d18; --paper-2:#282218; --card:#2a2620;
        --line:#3b352c; --line-2:#4c4436;
        --ink:#ece7de; --ink-2:#b5ac9e; --ink-3:#8f8678;
        --cinnabar:#e06a52; --cinnabar-deep:#ea8069;
        --cinnabar-soft:rgba(224,106,82,.13); --cinnabar-border:rgba(224,106,82,.35);
      }
    }
    .bg{fill:var(--paper)}
    .frame{fill:none;stroke:var(--line)}
    .node{fill:var(--card);stroke:var(--line)}
    .node-key{fill:var(--card);stroke:var(--cinnabar-border)}
    .node-band{fill:var(--cinnabar-soft)}
    .n-title{fill:var(--ink);font-family:var(--sans);font-size:12px;font-weight:700}
    .n-title-a{fill:var(--cinnabar-deep);font-family:var(--sans);font-size:12px;font-weight:700}
    .n-sub{fill:var(--ink-3);font-family:var(--mono);font-size:9.5px}
    .flow{stroke:var(--cinnabar);stroke-width:1.8;fill:none}
    .flow-head{fill:var(--cinnabar)}
    .flow-label{fill:var(--ink-3);font-family:var(--mono);font-size:9px}
    .divider{fill:var(--ink-3);font-family:var(--sans);font-size:11px}
    .driver{fill:var(--card);stroke:var(--line)}
    .d-title{fill:var(--ink);font-family:var(--sans);font-size:11px;font-weight:600}
    .d-code{fill:var(--ink-2);font-family:var(--mono);font-size:9px}
    .d-note{fill:var(--ink-3);font-family:var(--mono);font-size:8.5px}
    .dash{stroke:var(--line-2);stroke-width:1.4;stroke-dasharray:4,4;fill:none}
    .foot{fill:var(--ink-3);font-family:var(--sans);font-size:9px}
  </style>

  <rect class="bg" x="0" y="0" width="720" height="260" rx="10"/>
  <rect class="frame" x="0.5" y="0.5" width="719" height="259" rx="10"/>

  <!-- top flow -->
  <g>
    <rect class="node" x="24" y="56" width="110" height="62" rx="8"/>
    <text class="n-title" x="79" y="80" text-anchor="middle">Git repo</text>
    <text class="n-sub" x="79" y="98" text-anchor="middle">SKILL.md</text>
    <text class="n-sub" x="79" y="110" text-anchor="middle">any host</text>
  </g>

  <g>
    <path class="flow" d="M138,87 L196,87"/>
    <polygon class="flow-head" points="196,82 206,87 196,92"/>
    <text class="flow-label" x="167" y="79" text-anchor="middle">clone</text>
  </g>

  <g>
    <rect class="node-key" x="210" y="56" width="110" height="62" rx="8"/>
    <rect class="node-band" x="210" y="56" width="110" height="14" rx="7"/>
    <rect class="node-band" x="210" y="64" width="110" height="6"/>
    <text class="n-title-a" x="265" y="87" text-anchor="middle">Nexus</text>
    <text class="n-sub" x="265" y="103" text-anchor="middle">manifest + refs</text>
  </g>

  <g>
    <path class="flow" d="M324,87 L382,87"/>
    <polygon class="flow-head" points="382,82 392,87 382,92"/>
    <text class="flow-label" x="353" y="79" text-anchor="middle">symlink</text>
  </g>

  <g>
    <rect class="node" x="396" y="56" width="110" height="62" rx="8"/>
    <text class="n-title" x="451" y="80" text-anchor="middle">~/.dsh/skills/</text>
    <text class="n-sub" x="451" y="98" text-anchor="middle">links → clones</text>
    <text class="n-sub" x="451" y="110" text-anchor="middle">enable / disable</text>
  </g>

  <g>
    <path class="flow" d="M510,87 L568,87"/>
    <polygon class="flow-head" points="568,82 578,87 568,92"/>
    <text class="flow-label" x="539" y="79" text-anchor="middle">watch</text>
  </g>

  <g>
    <rect class="node" x="582" y="56" width="114" height="62" rx="8"/>
    <text class="n-title" x="639" y="80" text-anchor="middle">DSH provider</text>
    <text class="n-sub" x="639" y="98" text-anchor="middle">filesystem</text>
    <text class="n-sub" x="639" y="110" text-anchor="middle">auto-discovers</text>
  </g>

  <!-- connectors: both drivers feed the same manifest -->
  <path class="dash" d="M220,156 L220,140 L500,140 L500,156"/>
  <path class="dash" d="M265,140 L265,120"/>

  <!-- drivers -->
  <g>
    <rect class="driver" x="100" y="156" width="240" height="74" rx="8"/>
    <text class="d-title" x="220" y="178" text-anchor="middle">Command line</text>
    <text class="d-code" x="220" y="196" text-anchor="middle">$ dsh-skills-nexus add github:…</text>
    <text class="d-code" x="220" y="210" text-anchor="middle">$ dsh-skills-nexus link trae-cn</text>
    <text class="d-note" x="220" y="223" text-anchor="middle">exit codes · --json</text>
  </g>

  <g>
    <rect class="driver" x="380" y="156" width="240" height="74" rx="8"/>
    <text class="d-title" x="500" y="178" text-anchor="middle">Web panel</text>
    <text class="d-code" x="500" y="196" text-anchor="middle">Settings → Skills Nexus</text>
    <text class="d-code" x="500" y="210" text-anchor="middle">cards · toggles · groups</text>
    <text class="d-note" x="500" y="223" text-anchor="middle">dark-mode aware</text>
  </g>

  <text class="foot" x="360" y="249" text-anchor="middle">CLI and panel drive the same manifest, clones and locks — mix freely</text>
</svg>
